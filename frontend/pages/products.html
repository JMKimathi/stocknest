<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockNest — Products</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">StockNest</div>
      <nav>
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="products.html" data-page="products">Products</a>
        <a href="categories.html" data-page="categories">Categories</a>
        <a href="suppliers.html" data-page="suppliers">Suppliers</a>
        <a href="users.html" data-page="users" class="admin-only">Users</a>
        <a href="profile.html" data-page="profile">My profile</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Products</h1>
        <div class="topbar-actions">
          <div class="user-chip" id="userChip"></div>
          <button class="secondary small" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div id="pageAlert" class="alert" style="display:none;"></div>

      <div class="card">
        <div class="table-toolbar">
          <div class="filters">
            <input type="text" id="searchInput" placeholder="Search by name or SKU...">
            <select id="categoryFilter"><option value="">All categories</option></select>
            <select id="lowStockFilter">
              <option value="">All stock levels</option>
              <option value="true">Low stock only</option>
            </select>
            <select id="archivedFilter" class="admin-only">
              <option value="">Active products</option>
              <option value="true">Archived products</option>
            </select>
          </div>
          <button id="addProductBtn">Add product</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SKU</th><th>Name</th><th>Category</th><th>Supplier</th>
                <th>Qty</th><th>Unit Price</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3 id="productModalTitle">Add Product</h3>
      <div id="productFormError" class="alert error" style="display:none;"></div>
      <form id="productForm">
        <input type="hidden" id="productId">
        <label>Name</label>
        <input type="text" id="productName" required>
        <label>SKU</label>
        <input type="text" id="productSku" required>
        <label>Description</label>
        <textarea id="productDescription" rows="2"></textarea>
        <div class="form-row">
          <div>
            <label>Category</label>
            <select id="productCategory"><option value="">None</option></select>
          </div>
          <div>
            <label>Supplier</label>
            <select id="productSupplier"><option value="">None</option></select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Initial Quantity</label>
            <input type="number" id="productQuantity" min="0" value="0">
          </div>
          <div>
            <label>Reorder Level</label>
            <input type="number" id="productReorderLevel" min="0" value="5">
          </div>
        </div>
        <label>Unit Price</label>
        <input type="number" id="productUnitPrice" min="0" step="0.01" value="0">

        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeModal('productModal')">Cancel</button>
          <button type="submit">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="stockModal">
    <div class="modal">
      <h3>Adjust Stock — <span id="stockProductName"></span></h3>
      <div id="stockFormError" class="alert error" style="display:none;"></div>
      <form id="stockForm">
        <input type="hidden" id="stockProductId">
        <label>Type</label>
        <select id="stockType">
          <option value="in">Stock In (add)</option>
          <option value="out">Stock Out (remove)</option>
          <option value="adjustment">Adjustment (set exact value)</option>
        </select>
        <label>Quantity</label>
        <input type="number" id="stockQuantity" min="1" required>
        <label>Reason (optional)</label>
        <input type="text" id="stockReason" placeholder="e.g. New delivery, damaged goods...">
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeModal('stockModal')">Cancel</button>
          <button type="submit">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal" style="width:540px;">
      <h3>Stock History — <span id="historyProductName"></span></h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Qty</th><th>Reason</th><th>By</th><th>When</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeModal('historyModal')">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
</body>
</html>
