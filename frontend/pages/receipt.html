<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<style>
  body { font-family: 'Courier New', monospace; background: #eee; margin: 0; padding: 20px; color: #000; }
  .receipt { width: 80mm; max-width: 100%; margin: 0 auto; background: #fff; padding: 14px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 12px; }
  .center { text-align: center; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .muted { color: #444; }
  hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; vertical-align: top; }
  .r { text-align: right; white-space: nowrap; }
  .item-name { font-weight: bold; }
  .total td { font-size: 14px; font-weight: bold; padding-top: 4px; }
  .void-stamp { border: 2px solid #b00; color: #b00; text-align: center; font-weight: bold; padding: 4px; margin: 8px 0; font-size: 14px; }
  .actions { text-align: center; margin: 16px auto; }
  .actions button { font-family: Arial, sans-serif; padding: 8px 18px; margin: 0 4px; cursor: pointer; border-radius: 4px; border: 1px solid #2c3e50; background: #2c3e50; color: #fff; }
  .actions button.secondary { background: #fff; color: #2c3e50; }
  @media print {
    body { background: #fff; padding: 0; }
    .receipt { box-shadow: none; width: 100%; padding: 0; }
    .actions { display: none; }
    @page { margin: 4mm; }
  }
</style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">Print receipt</button>
    <button class="secondary" onclick="window.close()">Close</button>
  </div>
  <div class="receipt" id="receipt"><p class="center">Loading receipt...</p></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/receipt.js"></script>
</body>
</html>
