<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockNest — Sign In</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>StockNest</h1>
      <p class="tagline">Sign in to continue</p>

      <div id="loginError" class="alert error" style="display:none; margin: 12px 18px 0;"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="loginBtn">Sign in</button>
      </form>

      <div class="hint-box">
        Admin: admin@stocknest.com / Admin@12345<br>
        Staff: staff@stocknest.com / Staff@12345
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
