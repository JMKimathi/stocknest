<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users — StockNest</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Users</h1>
        <div class="topbar-actions">
          <div class="user-chip" id="userChip"></div>
          <button class="secondary small" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div id="pageAlert" class="alert" style="display:none;"></div>

      <div class="card">
        <div class="table-toolbar">
          <div class="status-pills" id="userPills" style="margin:0">
            <button class="pill active" data-filter="">Everyone</button>
            <button class="pill" data-filter="pending">Waiting for approval <span id="pendingCount"></span></button>
            <button class="pill" data-filter="disabled">Disabled</button>
          </div>
          <button id="addBtn">Add user</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <h3 id="modalTitle">Add User</h3>
      <div id="formError" class="alert error" style="display:none;"></div>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <label>Name</label>
        <input type="text" id="itemName" required>
        <label>Email</label>
        <input type="email" id="itemEmail" required>
        <div id="passwordField">
          <label>Password</label>
          <input type="password" id="itemPassword" placeholder="At least 8 characters, letters and numbers">
          <div class="muted small-text">They will be asked to choose their own password the first time they sign in.</div>
        </div>
        <label>Role</label>
        <select id="itemRole">
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
        <label id="statusLabel" style="display:none;">Status</label>
        <select id="itemStatus" style="display:none;">
          <option value="1">Active</option>
          <option value="0">Disabled</option>
        </select>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeModal('itemModal')">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="resetModal">
    <div class="modal">
      <h3>Temporary password</h3>
      <p>Give this password to <strong id="resetName"></strong> (<span id="resetEmail"></span>). They will choose their own when they sign in.</p>
      <div class="temp-password" id="resetPassword"></div>
      <p class="muted small-text">It is shown only once. Copy it now.</p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="copyResetBtn">Copy</button>
        <button type="button" onclick="closeModal('resetModal')">Done</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/users.js"></script>
</body>
</html>
