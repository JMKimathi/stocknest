<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — StockNest</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth-page="change-password">
  <div class="auth-page">
    <aside class="auth-hero">
      <div class="brand" style="color:#fff">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5 12 21l9-4.5"/></svg></span>
        StockNest
      </div>
      <div>
        <h2>One last step. <em>Make it yours.</em></h2>
        <p class="lead">Your password was set by an admin. Choose a private one that only you know before you continue.</p>
      </div>
      <div class="foot">Use at least 8 characters, with letters and numbers.</div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="brand mobile-brand">
          <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5 12 21l9-4.5"/></svg></span>
          StockNest
        </div>
        <h1><span id="greeting"></span> choose a new password</h1>
        <p class="subtitle">You need to do this before using StockNest.</p>

        <div id="formError" class="alert error" role="alert"></div>

        <form id="changeForm" novalidate>
          <label for="currentPassword">Temporary password (the one you just used)</label>
          <div class="password-field">
            <input type="password" id="currentPassword" required autocomplete="current-password">
            <button type="button" class="toggle-pw">Show</button>
          </div>

          <label for="newPassword">New password</label>
          <div class="password-field">
            <input type="password" id="newPassword" required autocomplete="new-password" placeholder="At least 8 characters, letters and numbers">
            <button type="button" class="toggle-pw">Show</button>
          </div>
          <div class="strength"><span></span></div>
          <div class="strength-label"></div>

          <label for="confirmPassword">Confirm new password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" required autocomplete="new-password">
            <button type="button" class="toggle-pw">Show</button>
          </div>

          <button type="submit" id="submitBtn">Save and continue</button>
        </form>

        <p class="auth-links"><a href="login.html" id="signOutLink">Sign out instead</a></p>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth-pages.js"></script>
</body>
</html>
